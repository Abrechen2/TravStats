repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # These hooks don't read .gitattributes — they munge binaries
        # byte-for-byte. Exclude every format we actually ship as
        # binary so a commit with a PNG / .bin / font doesn't silently
        # corrupt it. Keeps text-hygiene checks on everything else.
        exclude: '\.(bin|png|jpe?g|gif|webp|ico|pdf|zip|gz|tar|woff2?|ttf|otf|eot)$'
      - id: end-of-file-fixer
        exclude: '\.(bin|png|jpe?g|gif|webp|ico|pdf|zip|gz|tar|woff2?|ttf|otf|eot)$'
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        # Raised in steps as our raster resolution evolved:
        #   1 MB → 4 MB (0.05° land mask, 3.2 MB)
        #   4 MB → 15 MB (0.025° land mask, 12.4 MB — Bosphorus,
        #           Hjeltefjorden, narrow Norwegian fjords visible)
        # Natural Earth 10 m at 0.025° is the realistic top end before
        # we'd need a CDN. Going to 0.005° (Bosphorus-precise) would
        # cost ~200 MB and definitely belongs on a CDN.
        args: ['--maxkb=15000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/src/scripts/.*\.py$

  - repo: local
    hooks:
      - id: prettier-frontend
        name: Prettier (frontend)
        language: node
        entry: npx --prefix frontend prettier --write
        files: ^frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: true
