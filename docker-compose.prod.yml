version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: travstats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - travstats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travstats-network

  # Ollama LLM Server (for AI-powered email parsing)
  ollama:
    image: ollama/ollama:latest
    container_name: travstats-ollama
    restart: unless-stopped
    volumes:
      - travstats-ollama-data:/root/.ollama
    networks:
      - travstats-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    image: ghcr.io/abrechen2/travstats:latest
    container_name: travstats-app
    restart: unless-stopped
    working_dir: /app/backend # default to backend so npm commands run in the right place
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true} # Set to false when serving via plain HTTP
      # Comma-separated list of allowed frontend origins (adjust to your LAN/hostnames)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Database connection
      DATABASE_URL: postgresql://flights:${DB_PASSWORD:-changeme}@db:5432/flights
      # JWT will be auto-generated and persisted to /app/data/jwt.secret
      # Optional: Set custom JWT_SECRET here
      # JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      # API Keys (optional)
      AIRLABS_API_KEY: ${AIRLABS_API_KEY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      # Admin & Instance Settings
      INSTANCE_NAME: ${INSTANCE_NAME:-TravStats}
      MAX_USERS: ${MAX_USERS:-10}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Seeding
      SEED_AIRPORTS: ${SEED_AIRPORTS:-true}
      CREATE_DEMO_USER: ${CREATE_DEMO_USER:-false}
      # LLM Parser Settings
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      USE_LLM_PARSER: ${USE_LLM_PARSER:-true}
      # Training Settings
      PYTHON_CMD: python3
      DOCKER: 'true'
    volumes:
      - travstats-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travstats-network

volumes:
  travstats-db-data:
    name: travstats-db-data
  travstats-app-data:
    name: travstats-app-data
  travstats-ollama-data:
    name: travstats-ollama-data

networks:
  travstats-network:
    name: travstats-network
    driver: bridge
