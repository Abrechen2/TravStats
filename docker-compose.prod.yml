version: "3.8"

# =====================================================================
#  TravStats — production stack
# =====================================================================
#
#  The only variable you have to set is DB_PASSWORD (in `.env`).
#  Everything else — instance name, user cap, API keys, Ollama model,
#  backup schedule, WebDAV off-site sync — is configured from the
#  admin UI after the first-run setup wizard.
#
#  Optional overrides (APP_PORT, COOKIE_SECURE, CORS_ORIGIN, TZ,
#  DATABASE_URL for external Postgres) are documented in
#  `.env.prod.example`.
# =====================================================================

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: travstats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - travstats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travstats-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama LLM server — optional, powers AI-backed email/PDF parsing.
  # Disable by setting OLLAMA_URL to an empty string in the admin UI.
  ollama:
    image: ollama/ollama:latest
    container_name: travstats-ollama
    restart: unless-stopped
    volumes:
      - travstats-ollama-data:/root/.ollama
    networks:
      - travstats-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G

  app:
    image: ghcr.io/abrechen2/travstats:${VERSION:-latest}
    container_name: travstats-app
    restart: unless-stopped
    working_dir: /app/backend
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}

      # Runtime version is read from /app/backend/VERSION on container boot
      # (single source of truth; no env-var drift). The display version
      # strips any `-rc.N` / `-security-rc.N` / `-beta.N` / `-alpha.N`
      # suffix programmatically, so a byte-identical RC promoted to
      # `:latest` still shows the clean final version in About.

      # Database — DB_PASSWORD is the only required variable. Alternatively
      # set DATABASE_URL directly to point at an external Postgres instance.
      DATABASE_URL: ${DATABASE_URL:-postgresql://flights:${DB_PASSWORD}@db:5432/flights}

      # Secure-cookie auto-detect via X-Forwarded-Proto works behind any
      # standard reverse proxy. Override only if your proxy doesn't set it.
      COOKIE_SECURE: ${COOKIE_SECURE:-}

      # CORS stays disabled (same-origin) unless an override is provided.
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # Default Ollama endpoint inside the stack. Admin can change model
      # (and disable entirely) via the UI.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

      # Docker container name of the Postgres service — used by the backup
      # scheduler to shell into the DB container for pg_dump.
      DOCKER_DB_CONTAINER: ${DOCKER_DB_CONTAINER:-travstats-db}
      DOCKER: "true"
    volumes:
      - travstats-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travstats-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  travstats-db-data:
    name: travstats-db-data
  travstats-app-data:
    name: travstats-app-data
  travstats-ollama-data:
    name: travstats-ollama-data

networks:
  travstats-network:
    name: travstats-network
    driver: bridge
