version: "3.8"

# =====================================================================
#  TravStats — production stack
# =====================================================================
#
#  The only variable you have to set is DB_PASSWORD (in `.env`).
#  Everything else — instance name, user cap, API keys, Ollama model,
#  backup schedule, WebDAV off-site sync — is configured from the
#  admin UI after the first-run setup wizard.
#
#  Optional overrides (APP_PORT, COOKIE_SECURE, CORS_ORIGIN, TZ,
#  DATABASE_URL for external Postgres) are documented in
#  `.env.prod.example`.
# =====================================================================

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: travstats-db
    restart: unless-stopped
    # forgejo#415 N5: the app does NOT connect as a superuser. POSTGRES_USER is
    # the bootstrap superuser, used only while the volume is first initialised;
    # the wrapper below drops a one-off init script that creates the ordinary
    # role `flights` (same name and password as before, so DATABASE_URL is
    # unchanged), makes it owner of the database and installs the extensions
    # the migrations need (postgis is not "trusted", so only a superuser can
    # create it — doing it here is why the migrations then run without one).
    # The script is written from here, not mounted, because this file is
    # installed on its own with a single `curl -O`.
    #
    # EXISTING installs are untouched: initdb scripts run only on an empty
    # volume, and the old `flights` superuser keeps working. To drop its
    # privileges by hand: `ALTER ROLE flights NOSUPERUSER;` (see SECURITY.md).
    # Backup and restore work either way: for an ordinary role the restore keeps
    # postgis and the other extensions in place and drops only the app's own
    # objects (backend/src/services/backup/restorePsql.ts).
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /docker-entrypoint-initdb.d/20-app-role.sh <<'SCRIPT'
        #!/bin/sh
        set -e
        psql -v ON_ERROR_STOP=1 -v pw="$$APP_DB_PASSWORD" -v db="$$POSTGRES_DB" \
          --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
        CREATE ROLE flights LOGIN PASSWORD :'pw' NOSUPERUSER NOCREATEDB NOCREATEROLE;
        CREATE EXTENSION IF NOT EXISTS postgis;
        CREATE EXTENSION IF NOT EXISTS unaccent;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
        ALTER DATABASE :"db" OWNER TO flights;
        ALTER SCHEMA public OWNER TO flights;
        SQL
        SCRIPT
        chmod 755 /docker-entrypoint-initdb.d/20-app-role.sh
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - travstats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travstats-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama LLM server — optional, powers AI-backed email/PDF parsing.
  # Turn it off with the "KI-Parser" switch under Admin → Parser: that stops
  # every model call.
  ollama:
    image: ollama/ollama:0.24.0
    container_name: travstats-ollama
    restart: unless-stopped
    volumes:
      - travstats-ollama-data:/root/.ollama
    networks:
      - travstats-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G

  app:
    image: ghcr.io/abrechen2/travstats:${VERSION:-latest}
    container_name: travstats-app
    restart: unless-stopped
    working_dir: /app/backend
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}

      # Runtime version is read from /app/backend/VERSION on container boot
      # (single source of truth; no env-var drift). The display version
      # strips any `-rc.N` / `-security-rc.N` / `-beta.N` / `-alpha.N`
      # suffix programmatically, so a byte-identical RC promoted to
      # `:latest` still shows the clean final version in About.

      # Database — DB_PASSWORD is the only required variable. Alternatively
      # set DATABASE_URL directly to point at an external Postgres instance.
      DATABASE_URL: ${DATABASE_URL:-postgresql://flights:${DB_PASSWORD}@db:5432/flights}

      # Leave COOKIE_SECURE unset (or empty) to auto-detect: the cookie is
      # marked Secure only when the request arrived over https (directly or
      # via X-Forwarded-Proto). An empty value counts as unset since 2.6.3 —
      # 2.6.2 read it as "true", so a plain-http LAN install could not sign in.
      # Set "false" to never mark it Secure, any other value to always do so.
      COOKIE_SECURE: ${COOKIE_SECURE:-}

      # CORS stays disabled (same-origin) unless an override is provided.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Public HTTPS map style URLs; empty uses OpenFreeMap.
      MAP_STYLE_STANDARD_URL: ${MAP_STYLE_STANDARD_URL:-}
      MAP_STYLE_LIGHT_URL: ${MAP_STYLE_LIGHT_URL:-}
      MAP_STYLE_DARK_URL: ${MAP_STYLE_DARK_URL:-}
      MAP_STYLE_VOYAGER_URL: ${MAP_STYLE_VOYAGER_URL:-}

      # Name any reverse proxy in front of this stack (see .env.prod.example),
      # or all visitors share its address and one login rate limit.
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Default Ollama endpoint inside the stack. Copied into the instance
      # settings once, on the first start, when no address is stored yet; after
      # that only Admin > External services counts. Admin can change the model,
      # and switch the model off entirely, via the UI.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

      # Docker container name of the Postgres service — used by the backup
      # scheduler to shell into the DB container for pg_dump.
      DOCKER_DB_CONTAINER: ${DOCKER_DB_CONTAINER:-travstats-db}

      # Starting a new version snapshots the database BEFORE any migration
      # runs, and REFUSES TO START if it cannot. Nothing is migrated in that
      # case, so the previous image still works — which is the point.
      # The usual cause is a pg_dump older than the server: pg_dump cannot dump
      # a server newer than its own MAJOR version (newer client is fine).
      # Set this to the literal "true" to upgrade with no snapshot; take your
      # own backup first and unset it again afterwards. See README → Upgrades.
      # SKIP_PRE_MIGRATION_BACKUP: "true"
      DOCKER: "true"
    volumes:
      - travstats-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travstats-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  travstats-db-data:
    name: travstats-db-data
  travstats-app-data:
    name: travstats-app-data
  travstats-ollama-data:
    name: travstats-ollama-data

networks:
  travstats-network:
    name: travstats-network
    driver: bridge
