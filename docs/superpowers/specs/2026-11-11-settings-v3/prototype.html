<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TravStats Einstellungen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar (search, view level), menu column + one settings page; rows = label left, control right.
   Tokens follow the app's tokens.css (ink blue-black, amber accent); the light set is new. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#f3f5f7; --tile:#e4e8ec;
  --border:rgba(20,28,38,.13); --border-input:rgba(20,28,38,.28);
  --text:#1a1e24; --bright:#0c0f13; --muted:rgba(26,30,36,.72); --faint:rgba(26,30,36,.6);
  --accent:#9a5a00; --accent-text:#ffffff; --accent-soft:rgba(154,90,0,.11); --accent-line:rgba(154,90,0,.45);
  --good:#0f7a6b; --bad:#b4281d; --info:#255f9e; --warn:#8a5a00; --beta:#6a3fb5;
  --good-bg:rgba(15,122,107,.1); --bad-bg:rgba(180,40,29,.08); --warn-bg:rgba(138,90,0,.1); --info-bg:rgba(37,95,158,.09);
  --hover:rgba(20,28,38,.05); --scrim:rgba(12,15,19,.5);
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hit:36px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --surface:#14181d; --surface2:#101317; --tile:#1d232b;
  --border:rgba(231,227,220,.12); --border-input:rgba(231,227,220,.3);
  --text:#e7e3dc; --bright:#f6efe4; --muted:rgba(231,227,220,.74); --faint:rgba(231,227,220,.62);
  --accent:#f0a947; --accent-text:#0b0d10; --accent-soft:rgba(240,169,71,.14); --accent-line:rgba(240,169,71,.45);
  --good:#5ec2b2; --bad:#f2837a; --info:#7fadde; --warn:#e0a345; --beta:#bc8cff;
  --good-bg:rgba(94,194,178,.12); --bad-bg:rgba(238,108,97,.12); --warn-bg:rgba(216,149,47,.12); --info-bg:rgba(111,160,214,.1);
  --hover:rgba(231,227,220,.05); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#14181d; --surface2:#101317; --tile:#1d232b;
  --border:rgba(231,227,220,.12); --border-input:rgba(231,227,220,.3);
  --text:#e7e3dc; --bright:#f6efe4; --muted:rgba(231,227,220,.74); --faint:rgba(231,227,220,.62);
  --accent:#f0a947; --accent-text:#0b0d10; --accent-soft:rgba(240,169,71,.14); --accent-line:rgba(240,169,71,.45);
  --good:#5ec2b2; --bad:#f2837a; --info:#7fadde; --warn:#e0a345; --beta:#bc8cff;
  --good-bg:rgba(94,194,178,.12); --bad-bg:rgba(238,108,97,.12); --warn-bg:rgba(216,149,47,.12); --info-bg:rgba(111,160,214,.1);
  --hover:rgba(231,227,220,.05); --scrim:rgba(0,0,0,.62); color-scheme:dark}
@media (pointer:coarse){:root{--hit:44px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
main:focus{outline:none}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ico{width:16px;height:16px;flex:none}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top .in{display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;color:var(--bright);white-space:nowrap}
.iconbtn.menu-btn{display:none}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none}
.search input{width:100%;height:var(--hit);background:var(--surface2);border:1px solid var(--border-input);border-radius:9px;padding:0 44px 0 34px}
.search kbd{position:absolute;right:10px;top:50%;translate:0 -50%;font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--border-input);border-radius:5px;padding:0 6px}
.hits{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border-input);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:min(70vh,520px);overflow:auto;box-shadow:0 10px 30px var(--scrim)}
.hit{display:flex;flex-direction:column;gap:1px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;min-height:var(--hit)}
.hit[aria-selected=true],.hit:hover{background:var(--accent-soft)}
.hit b{font-weight:600;color:var(--bright)}
.hit mark{background:none;color:var(--accent);font-weight:700}
.hitnote{padding:6px 10px;font-size:12.5px;color:var(--faint)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;flex:none}
.seg button{background:none;border:0;border-radius:6px;padding:0 12px;min-height:calc(var(--hit) - 8px);color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--tile);color:var(--bright);font-weight:600}
.iconbtn{display:inline-grid;place-items:center;width:var(--hit);height:var(--hit);background:none;border:1px solid var(--border);border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--hover)}

.proto{background:var(--accent-soft);border-bottom:1px solid var(--border);color:var(--text);font-size:12.5px}
.proto .in{max-width:1240px;margin:0 auto;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;min-height:0}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:36px;max-width:1240px;margin:0 auto;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{align-self:start;position:sticky;top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 90px);overflow:auto;padding-bottom:12px}
nav .grp{display:flex;flex-direction:column;gap:2px}
nav h2{font-size:12.5px;font-weight:600;color:var(--faint);padding:0 10px 4px}
nav a{display:flex;align-items:center;gap:10px;min-height:var(--hit);padding:0 10px;border-radius:8px;color:var(--text);text-decoration:none}
nav a:hover{background:var(--hover)}
nav a[aria-current=page]{background:var(--tile);color:var(--bright);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav a.sub{margin-left:18px;min-height:calc(var(--hit) - 6px);font-size:14px}
nav a .ico{opacity:.8}
nav a .badge{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--accent-line)}
.more-note{font-size:12.5px;color:var(--faint);padding:2px 10px}
.ver{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding:0 10px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .iconbtn.menu-btn{display:inline-grid}
  .top .in{flex-wrap:wrap}
  .search{order:5;flex:1 1 100%;max-width:none;margin-left:0}
  .seg{margin-left:auto}
  nav.side{position:fixed;z-index:35;inset:0 auto 0 0;width:min(320px,86vw);max-height:none;background:var(--surface);border-right:1px solid var(--border);padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));translate:-105% 0;transition:translate .18s;visibility:hidden}
  nav.side.open{translate:0 0;visibility:visible}
  .brand{display:none}
  .seg button{padding:0 9px}
}
.scrim{position:fixed;inset:0;z-index:34;background:var(--scrim)}
@media (prefers-reduced-motion:reduce){nav.side{transition:none}}

/* page */
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;flex-direction:column;gap:8px}
.crumb{font-size:13px;color:var(--faint)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,4vw,34px);line-height:1.15;color:var(--bright);text-wrap:balance}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13.5px;color:var(--muted)}
.save-state{display:inline-flex;align-items:center;gap:6px;color:var(--good);min-height:20px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.toc a:hover{border-color:var(--accent-line);color:var(--bright)}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;scroll-margin-top:84px}
section.card>h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 20px 8px;font-size:16px;font-weight:650;color:var(--bright)}
section.danger{border-color:var(--bad)}
section.danger>h2{color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 20px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
section>h2+.row,section>h2+.card-note+.row{border-top:0}
.row .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500;color:var(--bright)}
.row .s{grid-column:1;font-size:13.5px;color:var(--muted);max-width:62ch}
.row .c{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;max-width:380px}
.row .full{grid-column:1 / -1}
.row.blocked .c{opacity:.5}
.row.hit-flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.hit-flash{animation:none;background:var(--accent-soft)}}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr);padding:14px 16px}
  .row .c{grid-row:auto;grid-column:1;justify-content:flex-start;max-width:none;margin-top:6px}
  .row .c .inp{width:100%}
  section.card>h2{padding-inline:16px}
}
.help-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0 2px;min-height:24px;font-size:13px;font-weight:400;color:var(--info);text-decoration:underline;text-underline-offset:3px}
.help{font-size:13.5px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-width:68ch}

.chip{font-size:12px;font-weight:500;padding:0 8px;line-height:20px;border-radius:999px;border:1px solid var(--border-input);color:var(--muted);white-space:nowrap}
.chip.inst{color:var(--info);border-color:var(--info);background:var(--info-bg)}
.chip.x{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.beta{color:var(--beta);border-color:var(--beta)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px 2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--border-input);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:var(--good-bg);border-color:var(--good)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}

.inp{height:var(--hit);background:var(--surface2);border:1px solid var(--border-input);border-radius:8px;padding:0 11px;width:230px;max-width:100%}
.inp:disabled{opacity:.6;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);padding:0 14px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);color:var(--bright);font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
.tog{position:relative;flex:none;width:44px;height:var(--hit);background:none;border:0;padding:0}
.tog::before{content:"";position:absolute;left:0;top:50%;translate:0 -50%;width:44px;height:24px;border-radius:999px;background:var(--tile);border:1px solid var(--border-input)}
.tog::after{content:"";position:absolute;left:4px;top:50%;translate:0 -50%;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.tog[aria-checked=true]::before{background:var(--accent);border-color:var(--accent)}
.tog[aria-checked=true]::after{left:24px;background:var(--accent-text)}
.tog:disabled{cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.tog::after{transition:none}}
.onoff{font-size:13px;color:var(--muted);min-width:2.4em;text-align:right}
.choice{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;flex-wrap:wrap}
.choice button{background:none;border:0;border-radius:6px;padding:0 12px;min-height:calc(var(--hit) - 8px);color:var(--muted)}
.choice button[aria-pressed=true]{background:var(--tile);color:var(--bright);font-weight:600}
.list{display:flex;flex-direction:column;gap:4px}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:var(--surface2);border-radius:8px;font-size:14px}
.list .li .caption{color:var(--muted);font-size:13px}
.list .empty{padding:8px 12px;border:1px dashed var(--border-input);border-radius:8px;color:var(--muted);font-size:13.5px}
.caption{font-size:13px;color:var(--muted)}
.dep{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px}
.dep .btn{min-height:30px;padding:0 10px;font-size:13px}
.done{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13.5px}
.note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--border-input);border-radius:10px;color:var(--muted);font-size:14px}
.svc-filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.svc-filter button{border-radius:999px;border:1px solid var(--border-input);background:var(--surface);padding:0 13px;min-height:calc(var(--hit) - 6px);color:var(--muted)}
.svc-filter button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.svc-filter .sep{flex:1}
details.svc{border-top:1px solid var(--border)}
details.svc:first-of-type{border-top:0}
details.svc>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:0 12px;padding:12px 20px;align-items:center;min-height:56px}
details.svc>summary::-webkit-details-marker{display:none}
details.svc>summary:hover{background:var(--hover)}
details.svc>summary b{font-weight:600;color:var(--bright)}
details.svc>summary .s{grid-column:1;font-size:13.5px;color:var(--muted)}
details.svc>summary .pill{grid-row:1 / span 2;grid-column:2}
details.svc>summary .chev{grid-row:1 / span 2;grid-column:3;color:var(--faint);transition:rotate .15s}
details.svc[open]>summary .chev{rotate:90deg}
details.svc[open]>summary{background:var(--surface2)}
details.svc>.body{background:var(--surface2)}
details.svc>.body .row{border-top:1px solid var(--border)}
@media (max-width:620px){details.svc>summary{padding-inline:16px}}

/* confirm dialog */
dialog{border:1px solid var(--border-input);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(460px,calc(100vw - 32px));box-shadow:0 20px 60px var(--scrim)}
dialog::backdrop{background:var(--scrim)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:22px}
dialog h2{font-family:var(--serif);font-size:23px;font-weight:500;color:var(--bright)}
dialog .subject{font-weight:600;color:var(--bright)}
dialog .impact{font-weight:600;color:var(--bad)}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
dialog label{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
dialog .inp{width:100%}
.toast{position:fixed;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;max-width:calc(100vw - 32px);background:var(--bright);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px var(--scrim)}

/* v3 additions */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.stat b{font-size:20px;font-weight:650;color:var(--bright);font-variant-numeric:tabular-nums}
.callout{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;font-size:14px;background:var(--info-bg);color:var(--text);border:1px solid var(--border)}
.callout.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.callout .btn{margin-left:auto}
.row .full{grid-column:1 / -1}
.infoval{display:inline-flex;align-items:center;gap:7px;color:var(--bright);font-variant-numeric:tabular-nums}
.infoval .dotp{width:8px;height:8px;border-radius:50%;background:var(--good)}
.infoval.warn .dotp{background:var(--warn)}.infoval.bad .dotp{background:var(--bad)}
.inforow{background:var(--surface)}
.auto{color:var(--muted)}.auto b{color:var(--bright);font-weight:500}
.num{display:inline-flex;align-items:center;gap:8px}.num .inp{width:110px}
.mono{font-family:var(--mono);font-size:13px}
.secret{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.iconbtn.sm{width:32px;height:32px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.err{color:var(--bad);font-size:13.5px;max-width:34ch}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
ul.list{list-style:none;margin:0;padding:0}
.list .li{flex-wrap:wrap}
.list .grow,.grow{flex:1;display:flex;flex-direction:column;min-width:0}
.list .li .btn{flex:none}
.list .li .caption{display:block}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:8px 20px 20px}
.svc-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);min-height:112px}
.svc-card:hover{border-color:var(--accent-line)}
.svc-card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.svc-card b{color:var(--bright);font-weight:600}
.svc-card .pill{margin-top:auto}
@media (max-width:620px){.svc-grid{padding-inline:16px}}
dialog form.wide{gap:4px}dialog:has(form.wide){width:min(560px,calc(100vw - 32px))}
dialog .dlgrow{grid-template-columns:minmax(0,1fr) auto;padding:10px 0;border-top:1px solid var(--border);align-items:center}
dialog .dlgfields{display:flex;flex-direction:column}
dialog .dlgrow label{color:var(--text);font-size:14.5px;display:block}

/* ---------- menu, page ---------- */
function counts(){let n=0,m=0;const add=(x)=>x?m++:n++;
  PAGES.filter(p=>p.area!=="server"||S.admin).forEach(p=>{if(p.svcPage)return;rowsOf(p).forEach(r=>{if(["info","callout","link"].includes(r.k))return;add(p.x||r.x)})});
  SERVICES.forEach(s=>s.f.forEach(f=>add(s.x||f.x)));return[n,m]}
function renderMenu(){
  let h="";
  for(const[a,label]of AREAS){
    const ps=PAGES.filter(p=>p.area===a&&pageShown(p));
    const off=a==="track"?!val("offer_tt"):a==="plan"?!val("offer_plan"):false;
    if(a==="server"&&!S.admin)continue;
    if(!ps.length&&!off)continue;
    h+=`<div class="grp"><h2>${label}</h2>`;
    if(off)h+=`<span class="more-note">Dieser Server bietet ${a==="track"?"TravTrack":"TravPlan"} nicht an.</span>`;
    for(const p of ps)h+=`<a href="#${p.id}" ${p.id===S.page?'aria-current="page"':""}>${ico(p.ico)}<span>${esc(p.t)}</span>${p.badge?`<span class="badge" title="${esc(p.badgeT||"")}">${p.badge}</span>`:""}</a>`;
    const hid=PAGES.filter(p=>p.area===a&&pageOn(p)&&!pageShown(p)).length;
    if(hid)h+=`<span class="more-note">${hid} weitere ${hid===1?"Seite":"Seiten"} in der Ansicht „Experte“</span>`;
    h+=`</div>`;
  }
  const[n,m]=counts();
  h+=`<div class="grp"><label class="devtog"><input type="checkbox" id="adm" ${S.admin?"checked":""}> Als Admin ansehen</label><span class="ver">TravStats 2.8.0 · Standard: ${n} Einstellungen · Experte: +${m}</span></div>`;
  $("menu").innerHTML=h;
  $("lv-std").setAttribute("aria-pressed",String(!X()));$("lv-x").setAttribute("aria-pressed",String(X()));
}
function page(){let p=PAGES.find(x=>x.id===S.page);if(!p||!pageOn(p))p=PAGES[0];return p}
function renderPage(){
  const act=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;
  const p=page();
  let h=`<div class="head"><span class="crumb">Einstellungen › ${esc(AREAS.find(a=>a[0]===p.area)[1].replace(", nur Admin",""))}</span><h1>${esc(p.t)}</h1><div class="scope"><span>${esc(p.d)}</span>${p.area==="server"||p.srv?'<span class="chip inst">Gilt für alle Konten</span>':""}</div></div>`;
  if(p.x&&!X())h+=`<div class="note">Diese Seite gehört zur Ansicht „Experte“.</div>`;
  if(p.stats)h+=`<div class="stats">${p.stats.map(s=>`<div class="stat"><span class="caption">${esc(s[0])}</span><b>${esc(s[1])}</b>${s[2]?`<span class="caption">${esc(s[2])}</span>`:""}</div>`).join("")}</div>`;
  if(p.svcPage)h+=servicesPage(p);
  else{
    const groups=[];rowsOf(p).filter(rowShown).forEach(r=>{const g=r.g||"";let o=groups.find(x=>x[0]===g);if(!o)groups.push(o=[g,[]]);o[1].push(r)});
    for(const[g,rs]of groups)h+=`<section class="card ${rs.every(r=>r.danger)?"danger":""}">${g?`<h2>${esc(g)}</h2>`:""}${rs.map(row).join("")}</section>`;
    const hid=rowsOf(p).filter(r=>cond(r.when)&&r.x&&!X()&&!S.show.has(r.id)).length;
    if(hid)h+=`<div class="note">${hid===1?"1 weitere Einstellung ist":hid+" weitere Einstellungen sind"} nur in der Ansicht „Experte“ zu sehen. <button class="btn" id="go-x">Experte anzeigen</button></div>`;
  }
  if(p.credit)h+=`<div class="credit">Ein Projekt von <a href="https://www.abrechen2.de/" class="wm" target="_blank" rel="noopener"><span class="a">&lt;</span>abrechen2<span class="a"> /&gt;</span></a></div>`;
  $("page").innerHTML=h;
  if(act){const el=$("page").querySelector(`[data-k="${CSS.escape(act)}"]`);if(el)el.focus({preventScroll:true})}
}
function render(){renderMenu();renderPage()}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function setLevel(l){S.lvl=l;store.set("ts-level",l);render()}
function closeMenu(){$("menu").classList.remove("open");$("scrim").hidden=true;$("menu-btn").setAttribute("aria-expanded","false")}
function route(){
  const[pg,anchor]=location.hash.slice(1).split(".");
  if(PAGES.some(p=>p.id===pg))S.page=pg;
  closeMenu();render();
  if(anchor){const el=$("row-"+anchor);if(el){el.scrollIntoView({block:"center"});el.classList.add("hit-flash")}}else{window.scrollTo(0,0);$("page").focus({preventScroll:true})}
}

/* ---------- dialogs ---------- */
function confirmDialog(d,onOk,danger=true){
  const[title,subject,impact,conseq,label,word]=d;const dlg=$("dlg");
  $("dlg-form").className="";
  $("dlg-form").innerHTML=`<h2 id="dlg-title">${esc(title)}</h2><div class="subject">${esc(subject)}</div>${impact?`<div class="impact">${esc(impact)}</div>`:""}<p style="margin:0">${esc(conseq)}</p>${word?`<label>Zum Bestätigen „${esc(word)}“ eintippen<input class="inp" id="dlg-word" autocomplete="off" autocapitalize="off"></label>`:""}<div class="actions"><button type="button" class="btn" id="dlg-cancel" autofocus>Abbrechen</button><button type="submit" class="btn ${danger?"danger solid":"primary"}" id="dlg-ok" ${word?"disabled":""}>${esc(label)}</button></div>`;
  if(word)$("dlg-word").addEventListener("input",e=>{$("dlg-ok").disabled=e.target.value.trim().toUpperCase()!==word.toUpperCase()});
  $("dlg-cancel").onclick=()=>dlg.close();$("dlg-form").onsubmit=e=>{e.preventDefault();dlg.close();onOk()};dlg.showModal();
}
function formDialog(title,fields,onOk){
  $("dlg-form").className="";
  $("dlg-form").innerHTML=`<h2 id="dlg-title">${esc(title)}</h2>${fields.map((f,i)=>`<label>${esc(f[0])}<input class="inp" id="ff-${i}" ${f[1]==="date"?'type="date"':""} ${f[1]==="number"?'type="number"':""} ${i===0?"autofocus":""} required></label>`).join("")}<div class="actions"><button type="button" class="btn" id="dlg-cancel">Abbrechen</button><button type="submit" class="btn primary">Hinzufügen</button></div>`;
  $("dlg-cancel").onclick=()=>$("dlg").close();$("dlg-form").onsubmit=e=>{e.preventDefault();const v=fields.map((_,i)=>$("ff-"+i).value.trim());$("dlg").close();onOk(v)};$("dlg").showModal();
}
function doAction(id){
  const hit=ALL.find(x=>x.r.id===id);if(!hit)return;const r=hit.r;
  const dd=r.dlg&&DIALOGS[r.dlg];
  if(dd)return confirmDialog(dd,()=>finish(r),!!r.danger||!!dd[2]);
  if(r.danger)return confirmDialog([r.t+"?",r.s||"",""," Das lässt sich nicht zurücknehmen.",r.btn||r.t,""],()=>finish(r));
  finish(r);
}
function finish(r){if(r.res){S.done[r.id]=r.res;renderPage();return}toast(r.toast||"Im Prototyp nicht ausgeführt.")}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-sw],[data-seg],[data-act],[data-help],[data-over],[data-reset],[data-eye],[data-chg],[data-add],[data-lrm],[data-lact],[data-mv],[data-cat],[data-only],[data-only-off],[data-svc],[data-ack],[data-test],[data-dsw],[data-dpause],#go-x");
  if(!t)return;const d=t.dataset;
  if(t.id==="go-x")return setLevel("expert");
  if(d.sw){save(d.sw,!val(d.sw));return render()}
  if(d.seg){save(d.seg,d.v);return render()}
  if(d.act)return doAction(d.act);
  if(d.help){S.openHelp.has(d.help)?S.openHelp.delete(d.help):S.openHelp.add(d.help);return renderPage()}
  if(d.over){S.over.add(d.over);return renderPage()}
  if(d.reset){const r=ALL.find(x=>x.r.id===d.reset).r;S.over.delete(d.reset);S.vals[d.reset]=r.v;return renderPage()}
  if(d.eye){S.reveal.has(d.eye)?S.reveal.delete(d.eye):S.reveal.add(d.eye);return S.svc?openService(S.svc,ACCT_SVC):renderPage()}
  if(d.chg){S.reveal.add("edit:"+d.chg);return S.svc?openService(S.svc,ACCT_SVC):renderPage()}
  if(d.add){const r=ALL.find(x=>x.r.id===d.add).r;return formDialog(r.btn||"Hinzufügen",r.add,v=>{S.lists[r.id].push({a:r.fmt?r.fmt(v):v[v.length-1],b:r.fmtb?r.fmtb(v):""});S.flash[r.id]={ok:1};renderPage();setTimeout(()=>{delete S.flash[r.id]},2000)})}
  if(d.lrm){const[id,i]=d.lrm.split(":");S.lists[id].splice(+i,1);return renderPage()}
  if(d.lact){const[id,i,k]=d.lact.split(":");const r=ALL.find(x=>x.r.id===id).r;const it=S.lists[id][+i];const dd=DIALOGS[k];return confirmDialog(dd?dd:[k+"?",it.a,"","",k,""],()=>{if(r.rmOnAct)S.lists[id].splice(+i,1);renderPage();toast("Im Prototyp nicht ausgeführt.")})}
  if(d.mv){const[id,i,dl]=d.mv.split(":");const a=S.lists[id],j=+i+ +dl;[a[+i],a[j]]=[a[j],a[+i]];return renderPage()}
  if(d.cat){S.cat=d.cat;if(d.onlyOff)S.svcOnly=false;return renderPage()}
  if(d.onlyOff!==undefined&&d.only===undefined&&t.hasAttribute("data-only-off")){S.cat="Alle";S.svcOnly=false;return renderPage()}
  if(d.only){S.svcOnly=!S.svcOnly;return renderPage()}
  if(d.svc){ACCT_SVC=d.acct==="1";return openService(d.svc,ACCT_SVC)}
  if(d.ack){S.ack.add(d.ack);return openService(d.ack,ACCT_SVC)}
  if(d.dsw){S.vals[d.dsw]=!val(d.dsw);return openService(S.svc,ACCT_SVC)}
  if(d.dpause){ACCT=ACCT_SVC;const k=(ACCT?"my.":"")+d.dpause;S.paused.has(k)?S.paused.delete(k):S.paused.add(k);return openService(S.svc,ACCT_SVC)}
  if(d.test){ACCT=ACCT_SVC;const pk=(ACCT?"my.":"")+d.test,k=S.vals[pk+".key"]||S.vals[pk+".client"]||S.vals[pk+".url"]||"";const bad=/x/i.test(String(k));
    if(bad){S.svcErr[pk]="Schlüssel abgelehnt";S.svcTest[pk]="Fehlgeschlagen: Der Anbieter hat den Schlüssel abgelehnt."}else{delete S.svcErr[pk];S.svcTest[pk]="Erreichbar · gerade geprüft"}
    openService(d.test,ACCT_SVC);return renderPage()}
});

document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.sel){save(d.sel,t.value);render()}
  else if(d.txt){if(d.secret){if(!t.value)return;save(d.txt,t.value);S.reveal.delete("edit:"+d.txt);if(S.svc){openService(S.svc,ACCT_SVC);renderPage()}else renderPage()}else{save(d.txt,t.value);const f=document.querySelector(`[data-fl="${CSS.escape(d.txt)}"]`);if(f&&S.flash[d.txt])f.outerHTML=flashHtml(d.txt);if(S.flash[d.txt]&&S.flash[d.txt].err)render()}}
  else if(d.dtxt||d.dsel){const k=d.dtxt||d.dsel;if(t.dataset.secret){if(!t.value)return;S.vals[k]=t.value;S.reveal.delete("edit:"+k)}else S.vals[k]=t.value;delete S.svcErr[(ACCT_SVC?"my.":"")+S.svc];openService(S.svc,ACCT_SVC);renderPage()}
  else if(t.id==="adm"){S.admin=t.checked;if(!S.admin&&page().area==="server")location.hash="#profil";render()}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.dtxt&&t.dataset.secret){S.vals[t.dataset.dtxt]=t.value}});
document.addEventListener("click",e=>{if(!e.target.closest(".search")){$("hits").hidden=true;$("q").setAttribute("aria-expanded","false")}});

/* ---------- search ---------- */
let hits=[],hsel=-1,showAll=false;
const mark=(t,q)=>{const f=fold(t),i=f.indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))};
function search(){
  const raw=$("q").value.trim(),q=fold(raw),box=$("hits");hits=[];hsel=-1;
  if(q.length<2){box.hidden=true;$("q").setAttribute("aria-expanded","false");return}
  for(const{p,r}of ALL){if(!pageOn(p)||!cond(r.when)||r.k==="callout")continue;const l=fold(r.t),tm=fold([r.s,r.h,p.t,r.g].join(" "));const rank=l.startsWith(q)?1:l.includes(q)?2:tm.includes(q)?3:null;if(rank)hits.push({p,r,rank,x:p.x||r.x})}
  for(const s of SERVICES){if(S.admin||s.own){const l=fold(s.n),tm=fold(s.p+" "+s.grp);const rank=l.startsWith(q)?1:l.includes(q)?2:tm.includes(q)?3:null;if(rank)hits.push({p:PAGES.find(p=>p.svcPage&&(S.admin?p.area==="server":p.area==="konto")),r:{id:"svc-"+s.id,t:s.n,g:s.grp},rank,x:s.x,svc:s.id})}}
  hits.sort((a,b)=>a.rank-b.rank);const shown=showAll?hits:hits.slice(0,8);
  box.innerHTML=hits.length?shown.map((h,i)=>`<button class="hit" role="option" id="hit-${i}" aria-selected="false" data-i="${i}"><b>${mark(h.r.t,q)}</b><span class="caption">${esc(h.p.t)}${h.r.g?" › "+esc(h.r.g):""}${h.x?" (Experte)":""}</span></button>`).join("")+(hits.length>8&&!showAll?`<button class="hit" data-all="1"><span>Alle ${hits.length} Treffer anzeigen</span></button>`:"")+(hits.some(h=>h.x)&&!X()?`<span class="hitnote">Treffer aus der Ansicht „Experte“ öffnen sich, ohne deine Ansicht zu ändern.</span>`:""):`<span class="hitnote">Nichts gefunden für „${esc(raw)}“. Probier ein kürzeres Wort.</span>`;
  box.hidden=false;$("q").setAttribute("aria-expanded","true");
}
function setSel(i){const o=[...$("hits").querySelectorAll("[role=option]")];if(!o.length)return;hsel=(i+o.length)%o.length;o.forEach((x,k)=>x.setAttribute("aria-selected",String(k===hsel)));$("q").setAttribute("aria-activedescendant",o[hsel].id);o[hsel].scrollIntoView({block:"nearest"})}
function go(i){const h=hits[i];if(!h)return;$("hits").hidden=true;$("q").value="";if(h.x&&!X()){S.show.add(h.r.id);S.found.add(h.r.id)}
  const t="#"+h.p.id+(h.svc?"":"."+h.r.id);if(location.hash===t)route();else location.hash=t;if(h.svc)setTimeout(()=>openService(h.svc,h.p.area==="konto"),50)}
$("q").addEventListener("input",()=>{showAll=false;search()});
$("q").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();if($("hits").hidden)search();setSel(hsel+1)}else if(e.key==="ArrowUp"){e.preventDefault();setSel(hsel-1)}else if(e.key==="Enter"){if(hits.length){e.preventDefault();go(hsel>=0?hsel:0)}}else if(e.key==="Escape"){$("hits").hidden=true}});
$("hits").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.all){showAll=true;return search()}go(+b.dataset.i)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)&&!document.querySelector("dialog[open]")){e.preventDefault();$("q").focus()}if(e.key==="Escape")closeMenu()});
$("dlg").addEventListener("close",()=>{S.svc=null});
$("lv-std").onclick=()=>setLevel("standard");$("lv-x").onclick=()=>setLevel("expert");
$("menu-btn").onclick=()=>{const o=$("menu").classList.toggle("open");$("scrim").hidden=!o;$("menu-btn").setAttribute("aria-expanded",String(o));if(o)$("menu").querySelector("a").focus()};
$("scrim").onclick=closeMenu;
$("theme-btn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("ts-theme",n)};
window.addEventListener("hashchange",route);
route();
</script>

</body></html>
