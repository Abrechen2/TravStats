name: CI (Forgejo)

# Runs on the homelab Forgejo runner (CT 146, label `homelab-docker`,
# job image node:22-bookworm). The GitHub workflows in .github/workflows stay
# authoritative on GitHub; because this directory exists, Forgejo ignores
# .github/workflows entirely, so claude*.yml and security.yml never run here.
#
# Deliberately a subset of .github/workflows/ci.yml: the same checks, minus
# the coverage merge (no artifact round-trip here; GitHub still enforces the
# coverage ratchet). Same honesty rules: no continue-on-error, no path filters.
#
# Difference to GitHub: jobs run inside a container, so service containers are
# reached by their service name (`postgres`), not via localhost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck + lint (both trees)
    runs-on: homelab-docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit
      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: File-size ratchet
        run: npm run check:size

  schema-drift:
    name: Prisma schema drift
    runs-on: homelab-docker
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_ci
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@postgres:5432/travstats_ci
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Schema drift
        run: npm run check:drift

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: homelab-docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: cd frontend && npm ci
      # Capped workers: the runner takes four jobs at once on 8 cores, and Vitest
      # otherwise starts one worker per core in every job. Uncapped, heavy React
      # suites (StayEditor) hit the 5 s test timeout on main runs 1261/1264/1280.
      - name: Vitest
        run: cd frontend && npx vitest --run --maxWorkers=2

  # The odd-zone runs (time-model plan, phase 1; ADR 0002 D6) - the same jobs
  # and the same verdict as .github/workflows/ci.yml, which explains them:
  # the suite once more under UTC+14 and UTC-3:30, judged by
  # scripts/check-tz-ratchet.mjs against scripts/tz-failures-baseline.json.
  frontend-tests-tz:
    name: Frontend tests (Vitest, TZ=${{ matrix.tz }})
    runs-on: homelab-docker
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Kiritimati, America/St_Johns]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: cd frontend && npm ci
      # Workers capped for the same reason as the UTC job.
      - name: Vitest under the odd zone
        env:
          TZ: ${{ matrix.tz }}
        run: |
          cd frontend
          code=0
          npx vitest --run --maxWorkers=2 --reporter=dot --reporter=json --outputFile.json=tz-report.json || code=$?
          echo "vitest exited ${code}; the odd-zone ratchet below is the verdict"
      - name: Odd-zone ratchet
        run: node scripts/check-tz-ratchet.mjs frontend "${{ matrix.tz }}" frontend/tz-report.json

  backend-tests:
    name: Backend tests (Jest ${{ matrix.shard }}/4)
    runs-on: homelab-docker
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_ci
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@localhost:5432/travstats_ci?connection_limit=5
      NODE_ENV: test
      # Throwaway CI literals, same values and reasons as .github/workflows/ci.yml.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TRAVSTATS_ALLOW_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: cd backend && npm ci
      # jest.globalSetup.ts refuses any database host that is not local, because
      # the suite deletes every user; there is deliberately no override. Here the
      # job runs in a container and the job-local PostGIS service is reachable as
      # `postgres`, so a tiny TCP proxy exposes it on localhost:5432 - the same
      # throwaway database, the guard untouched. Migrate, seed and Jest share one
      # step so the proxy is alive for all three.
      - name: Migrate, seed and run Jest
        run: |
          node -e "const n=require('net');n.createServer(c=>{const u=n.connect(5432,'postgres');c.pipe(u).pipe(c);u.on('error',()=>c.destroy());c.on('error',()=>u.destroy())}).listen(5432,'127.0.0.1')" >/dev/null 2>&1 &
          sleep 1
          cd backend
          npx prisma migrate deploy
          npx tsx scripts/seed-test-catalogues.ts
          npx jest --ci --forceExit --shard=${{ matrix.shard }}/4

  backend-tests-tz:
    name: Backend tests (Jest ${{ matrix.shard }}/4, TZ=${{ matrix.tz }})
    runs-on: homelab-docker
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Kiritimati, America/St_Johns]
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_ci
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@localhost:5432/travstats_ci?connection_limit=5
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TRAVSTATS_ALLOW_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: cd backend && npm ci
      # Same localhost proxy as backend-tests. Only Jest runs under the odd TZ;
      # migrate and seed run as in the UTC job, so the zone is the one variable.
      - name: Migrate, seed and run Jest under the odd zone
        run: |
          node -e "const n=require('net');n.createServer(c=>{const u=n.connect(5432,'postgres');c.pipe(u).pipe(c);u.on('error',()=>c.destroy());c.on('error',()=>u.destroy())}).listen(5432,'127.0.0.1')" >/dev/null 2>&1 &
          sleep 1
          cd backend
          npx prisma migrate deploy
          npx tsx scripts/seed-test-catalogues.ts
          code=0
          TZ="${{ matrix.tz }}" npx jest --ci --forceExit --shard=${{ matrix.shard }}/4 --json --outputFile=tz-report.json || code=$?
          echo "jest exited ${code}; the odd-zone ratchet below is the verdict"
      - name: Odd-zone ratchet
        run: node scripts/check-tz-ratchet.mjs backend "${{ matrix.tz }}" backend/tz-report.json
