name: Release

# Creates a GitHub Release from CHANGELOG.md when you push a v* tag.
# Does NOT build the Docker image — that happens locally via the /deploy
# and /release skills; the image is pushed straight to GHCR before the
# tag exists. This workflow only validates the tag against backend/VERSION
# and publishes the corresponding CHANGELOG section as the release body.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

run-name: Release ${{ github.ref_name }}

concurrency:
  group: release

jobs:
  validate:
    name: Validate VERSION vs Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Check VERSION matches tag
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG:-v${{ inputs.tag }}}"
          VERSION=$(cat backend/VERSION | tr -d '\r\n')
          # Strip any rc/beta/alpha suffix from the tag for the VERSION comparison,
          # so rc tags (v1.0.0-rc.2) can live on a commit where VERSION=1.0.0.
          TAG_BASE=${TAG#v}
          TAG_NO_PRERELEASE=${TAG_BASE%-*}
          EXPECTED=$VERSION
          if [ "$TAG_NO_PRERELEASE" != "$EXPECTED" ]; then
            echo "ERROR: Tag '$TAG' (base '$TAG_NO_PRERELEASE') does not match backend/VERSION '$VERSION'."
            echo "Bump backend/VERSION first, commit, then tag."
            exit 1
          fi
          echo "version=$TAG_BASE" >> $GITHUB_OUTPUT
          if echo "$TAG_BASE" | grep -qE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # For prereleases (1.0.0-rc.2), fall back to the matching base
          # version section (1.0.0) if no prerelease-specific section exists.
          BASE=${VERSION%-*}
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ] && [ "$VERSION" != "$BASE" ]; then
            NOTES=$(awk "/^## \[$BASE\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: TravStats v${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: false
