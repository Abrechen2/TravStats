name: CI

# What this workflow is for
# ------------------------
# Until August 2026 this file had exactly one substantive job (a Prettier
# check on changed frontend files). Everything else the repo already knows
# how to run — tsc, eslint, jest, vitest — ran only on the maintainer's
# machine before a deploy. That is a gate you have to remember to walk
# through, which means it is not a gate.
#
# The jobs below run the suites that already exist in package.json. Nothing
# here is new tooling; it is the existing tooling, wired to `push`.
#
# Honesty rules this file follows
# -------------------------------
# A check that cannot fail is worse than no check, because it buys the
# feeling of coverage without the coverage. So:
#
#   * No step carries `continue-on-error`. A step either matters or it is
#     not here. Where a whole job is advisory, the flag sits on the JOB and
#     the reason is written down next to it — never sprinkled per-step,
#     which is how a "required" check quietly becomes unfailable.
#   * Nothing is skipped by a path filter. A job skipped by a path filter
#     reports as green to branch protection, so a filter is a way of
#     passing a check without running it.
#   * Every advisory job writes its real outcome into the job summary, so
#     "this was allowed to fail" never reads the same as "this passed".
#
# Which jobs are safe to mark as REQUIRED in branch protection is listed
# per job below. Do not promote a job to required without re-measuring it.

on:
  push:
    # Lowercase: the default branch is `main`. This filter used to read
    # `Main`, and GitHub branch filters are case-sensitive, so the push
    # trigger never fired once.
    branches: [main]
    # Deliberately NO `paths:` filter. A path-filtered job that does not
    # run is reported to branch protection as successful, which is the
    # third way a gate can silently stop being a gate.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # SAFE TO REQUIRE. Measured green on main @ 80ca3061 (2026-08-30):
  # `npx tsc --noEmit` clean in both trees, `eslint` clean in both.
  # ---------------------------------------------------------------------
  static:
    name: Typecheck + lint (both trees)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # `npm ci` in backend/ triggers its postinstall (`prisma generate`).
      # tsc needs the generated client types, so this is not optional.
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Lint backend
        run: cd backend && npm run lint

      # eslint here runs with --max-warnings 0 (see frontend/package.json),
      # so a new warning fails the job rather than accumulating silently.
      - name: Lint frontend
        run: cd frontend && npm run lint

      # forgejo#60. Plain node against the working tree — no database, no
      # dependencies of its own, so it belongs in the cheapest job there is.
      #
      # It was runnable but unwired from 2026-09-01 until today, and on
      # 2026-09-15 that cost exactly what it was built to prevent: a branch
      # landed on main with four files grown past their frozen size, and
      # nobody saw it because nothing ran the check. The ratchet only holds
      # while something asks it.
      - name: File-size ratchet
        run: npm run check:size

  # ---------------------------------------------------------------------
  # forgejo#60. Answers one question: does schema.prisma agree with what the
  # migrations actually build? `--from-migrations` replays them into a shadow
  # database, so the answer does not depend on which branch any developer's
  # database last saw — which is the whole reason a local run could disagree
  # with a colleague's.
  #
  # Its own job because it is the only static check that needs a database.
  # Folding it into `static` would put a postgres service in front of the
  # typecheck, which runs on every push and does not need one.
  # ---------------------------------------------------------------------
  schema-drift:
    name: Prisma schema drift
    runs-on: ubuntu-latest

    services:
      postgres:
        # CI-local throwaways, unrelated to any developer or deployment
        # credentials. The user owns the container, so it may CREATE DATABASE
        # for the shadow — a restricted role would need SHADOW_DATABASE_URL
        # set explicitly instead.
        #
        # PostGIS, not plain postgres: the migrations CREATE EXTENSION postgis,
        # and on postgres:16-alpine the replay died on it. This job and the
        # Jest one were red on EVERY run from the day they were wired
        # (2026-09-15, forgejo#60) until 2026-09-16 — the other half was the
        # shadow database, which check-schema-drift.ts now creates itself.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@localhost:5432/travstats_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Schema drift
        run: npm run check:drift

  # ---------------------------------------------------------------------
  # SAFE TO REQUIRE. Measured green on main @ 80ca3061 (2026-08-30):
  # 371 files, 3254 tests, all passing, exit 0.
  #
  # The suite logs jsdom "HTMLCanvasElement.prototype.getContext is not
  # implemented" noise from the globe components. That is stderr output,
  # not a failure — do not "fix" it by making the job tolerate errors.
  # ---------------------------------------------------------------------
  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Coverage rides along with the same run (forgejo#62). `reportOnFailure`
      # so a red run still publishes its figure; the step is red either way.
      - name: Vitest
        run: >-
          cd frontend && npx vitest --run --coverage
          --coverage.reporter=json-summary --coverage.reporter=text-summary
          --coverage.reportOnFailure

      # Not below scripts/coverage-baseline.json, and the figure goes to the
      # job summary. Runs after a red Vitest too, so the number is never
      # missing from a failed run — but it cannot turn that run green.
      - name: Coverage ratchet
        if: success() || failure()
        run: node scripts/check-coverage.mjs frontend

  # ---------------------------------------------------------------------
  # REQUIRED since 2026-09-16 (owner decision). Until then this job was
  # advisory; the history below is why, and what changed.
  #
  # (Historical) ADVISORY — DO NOT MARK REQUIRED YET.
  #
  # The reason is the sharpest possible illustration of why "green" and
  # "checked" are different words. Measured on main @ 80ca3061 (2026-08-30)
  # against Postgres:
  #
  #   Test Suites: 2 failed, 354 passed, 356 total
  #   Tests:       3056 passed, 3056 total
  #
  # Every single test passes and the run still exits 1. The two red SUITES
  # contain no failing test: src/routes/__tests__/lodging.test.ts and
  # src/routes/__tests__/lodgingFxSource.test.ts both fail in `afterAll`
  # with Postgres 40P01 "deadlock detected". The lodging routes fire
  # checkAndUpdateAchievements deliberately without `await`, and teardown
  # deletes the user while that background write is still in flight. Both
  # fail identically in a control run with none of this workflow's changes,
  # so it is pre-existing and is not fixed here.
  #
  # A required check that is red while 3056 of 3056 tests pass would teach
  # everyone to click past it within a week. That is exactly the failure
  # mode this repo should avoid, so the job reports honestly and does not
  # gate.
  #
  # A CLEAN CHECKOUT FAILS MORE THAN THE MAINTAINER'S MACHINE DOES, and
  # CI is a clean checkout. Same commit, run against a throwaway database
  # with no developer state and no personal fixtures:
  #
  #   Test Suites: 3 failed, 1 skipped, 352 passed (355 of 356)
  #   Tests:       2 failed, 10 skipped, 3044 passed (3056 total)
  #
  # Only TWO tests actually fail, and both are environmental rather than
  # defects in the code under review. (The deadlock suites contribute zero
  # failing tests here — and which of them trips is not deterministic:
  # lodgingFxSource.test.ts failed in this run while lodging.test.ts
  # passed, the reverse of the maintainer's run. A race, not a fixed list.)
  # The two real failures:
  #
  #   * src/routes/__tests__/emailParse.referenceDate.test.ts asserts
  #     fs.existsSync() on
  #     "test-samples/Flug-emails/Buchungsdetails _ 23 November 2023_.msg".
  #     Only 7 files under test-samples/ are tracked and they are all
  #     .gitkeep/README — the sample is a real booking email that is not in
  #     the public repo. This test CANNOT pass on any fresh clone. It needs
  #     to skip when its fixture is absent before this job can ever be
  #     green.
  #   * src/__tests__/lodgingImportCommit.test.ts expects a non-null
  #     chainId, but scripts/seed-test-catalogues.ts never seeds the
  #     lodging-chain catalogue (it covers airlines, aircraft, ships,
  #     ports, airports and achievements). The seed step below deliberately
  #     calls the project's own script rather than a CI-only variant, so
  #     that CI and a local run stay the same thing; closing this gap
  #     belongs in that script.
  #
  # Promote this job to required only when all three are addressed — the
  # teardown deadlock, the missing-fixture guard, and the chain seed — and
  # only after re-measuring. Then delete `continue-on-error` below in one
  # deliberate move.
  #
  # RE-MEASURED 2026-09-16 — the first run that reached the suite at all.
  # Until that day the job died in `migrate deploy` (no PostGIS in the service
  # image) and then in jest.globalSetup (the destructive-test guard), so the
  # figures above were measured locally and nothing here had ever run. On
  # main @ 77b56258: 522 of 523 suites green. Neither the missing fixture nor
  # the chain seed failed — both had been addressed since. The single red
  # suite was lodging.test.ts, and not with 40P01: two CRUD cases timed out
  # at 5 s because they reached the real geocoder (Photon / Nominatim) from
  # the runner. That test now stubs the geocoder by default. What remains
  # before promotion is one more green run on main to confirm, and the
  # owner's decision.
  #
  # On the environment: main now carries jest.globalSetup.ts (fails fast
  # with one clear sentence when Postgres is unreachable, instead of a
  # four-figure failure count) and jest.setup.ts + workerIdleMemoryLimit
  # (which recycle the single worker and cap the Prisma pool). So this job
  # does NOT need to raise the heap or set a pool size itself; an earlier
  # revision did both and they are now redundant. connection_limit is left
  # on the URL below only because jest.setup.ts explicitly honours an
  # already-chosen limit, which makes the intent visible at the call site.
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Values are CI-local throwaways and intentionally unrelated to any
        # developer or deployment credentials. PostGIS for the same reason as
        # the drift job: `prisma migrate deploy` below failed on
        # CREATE EXTENSION postgis, so the suite never ran at all.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@localhost:5432/travstats_ci?connection_limit=5
      NODE_ENV: test
      # Not decoration, and not free-form. Several suites import src/index.ts,
      # which calls validateEnv() and answers a bad value with process.exit(1)
      # — that kills the whole jest run after a single file, which reads like
      # "the suite is broken" rather than "an env var is malformed". The
      # schema in src/config/env.ts demands JWT_SECRET >= 32 chars and
      # ENCRYPTION_KEY of EXACTLY 64 hex characters. Both values below are
      # throwaway CI literals with no relationship to any real key.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # jest.globalSetup.ts refuses to empty a database whose name does not
      # mark it as disposable. This one is a service container that exists
      # for this job only, so the permission is given on purpose rather than
      # by renaming the database to slip past the check. Once PostGIS let the
      # migrations through on 2026-09-16, this refusal was the next thing
      # standing between the job and its first actual test.
      TRAVSTATS_ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy

      # Not optional. `init` does not seed catalogues, and a large part of
      # the suite reaches the airport/aircraft catalogue on import — even
      # files that look like pure unit tests do, via the catalogue caches.
      # Without this the failures look like logic bugs.
      - name: Seed test catalogues
        run: cd backend && npx tsx scripts/seed-test-catalogues.ts

      - name: Jest
        id: jest
        run: >-
          cd backend && npx jest --ci --forceExit --coverage
          --coverageReporters=json-summary --coverageReporters=text-summary

      # The baseline was recorded from a green local run and CI's figures
      # matched it within the tolerance (2026-09-16). If a later CI figure
      # differs for an environment reason (a test that skips here), record
      # CI's figure rather than widening the tolerance. Runs after a red Jest
      # too, like the frontend ratchet, so the number is never missing.
      - name: Coverage ratchet
        if: success() || failure()
        run: node scripts/check-coverage.mjs backend

  # ---------------------------------------------------------------------
  # E2E (Playwright, Chromium) — added 2026-09-16 (forgejo#28).
  #
  # The browser suite existed and ran only on a developer machine. It needs
  # the whole stack, so this job builds it: PostGIS, migrations, the test
  # catalogues, the seeded dev admin (admin:admin123 with demo data), the
  # backend, and — started by playwright.config.ts's webServer — Vite on 3000.
  #
  # Chromium only: the full three-browser run takes ~7 minutes locally and
  # adds no coverage of our code, only of browser engines. The auth-ladder
  # passkey case needs Chromium anyway (CDP virtual authenticator).
  #
  # NODE_ENV=development on purpose: the E2E stack is a dev stack, and the
  # address-keyed rate limits step aside in development (one runner is one
  # address for every spec). OLLAMA_URL is empty so the booking-import spec
  # is answered by the template, as it demands.
  #
  # Until 2026-09-16 playwright.config.ts defaulted to port 5173 while Vite
  # serves 3000, so `npm run test:e2e` without PLAYWRIGHT_BASE_URL waited for
  # a server that never came up — the reason this could not simply be wired.
  # ---------------------------------------------------------------------
  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest

    services:
      postgres:
        # CI-local throwaways, unrelated to any real credentials.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travstats_ci
          POSTGRES_PASSWORD: travstats_ci
          POSTGRES_DB: travstats_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travstats_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travstats_ci:travstats_ci@localhost:5432/travstats_e2e
      NODE_ENV: development
      PORT: "8000"
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      OLLAMA_URL: ""
      VITE_API_URL: http://localhost:8000
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci && (cd backend && npm ci) && (cd frontend && npm ci)

      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy

      - name: Seed catalogues and the dev admin
        run: |
          cd backend
          npx tsx scripts/seed-test-catalogues.ts
          npm run seed:dev-admin

      - name: Start backend
        run: |
          cd backend
          nohup npx tsx src/index.ts > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && exit 0
            sleep 2
          done
          echo "backend did not become healthy" >&2
          tail -50 ../backend-e2e.log >&2
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test --project=chromium --reporter=line

      - name: Upload report and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            backend-e2e.log
          retention-days: 7

  # ---------------------------------------------------------------------
  # SAFE TO REQUIRE — the whole tree, since forgejo#61.
  #
  # This job used to check only the frontend files a change touched, and
  # said why: ~95 frontend files and nearly the whole backend had never been
  # formatted, so a repo-wide check would have been red on every push
  # whatever it contained. `9349b975` formatted the tree once (and is listed
  # in .git-blame-ignore-revs), which removes the reason. A full check is
  # also the cheaper one to reason about: nothing depends on a diff range.
  #
  # Scope is `.prettierignore` at the root — every exclusion there says why.
  # Run from the root, because that is where Prettier reads the ignore file.
  # prettier comes from frontend's lockfile, the same pinned version the
  # pre-commit hook uses.
  # ---------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Prettier check (whole tree)
        run: npx --prefix frontend prettier --check --ignore-unknown .
