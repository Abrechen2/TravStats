name: CI

# Solo-project CI: just a Prettier safety net for the rare external PR.
# The real quality gate is the local pre-/deploy hook (tsc + lint + tests
# both sides). Re-running it here was duplicate work that produced red
# badges without catching anything, so it was removed in May 2026.

on:
  push:
    branches: [Main]
    paths:
      - "frontend/src/**"
      - "frontend/.prettierrc*"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/.prettierrc*"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Frontend format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Prettier check
        run: cd frontend && npm run format:check
