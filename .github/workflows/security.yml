name: Security

# Why this file exists
# --------------------
# TravStats publishes a Docker image to GHCR and Docker Hub that strangers
# run on their own servers, and until August 2026 nothing in CI looked at
# dependencies at all — no audit, no scanner, no SARIF, nothing feeding the
# Security tab. The whole supply chain was checked by whoever happened to
# read `npm install` output.
#
# Separate from ci.yml on purpose. The README's CI badge points at ci.yml,
# and scanner findings arrive on someone else's schedule — a new CVE
# published against an unchanged dependency would otherwise turn the badge
# red for a commit that changed nothing. Correctness and supply chain are
# different questions and deserve different answers.
#
# What is a GATE here and what is a REPORT
# ----------------------------------------
# Only one thing blocks: a CRITICAL vulnerability in production
# dependencies. That threshold was picked by measuring, not by taste — see
# the audit job. Everything else is printed into the job log. Until
# 2026-10-25 it was uploaded to GitHub code scanning; the Security tab then
# held 514 open alerts (324 CodeQL, 190 Trivy), mostly test code and
# unreachable dev chains, and nobody triaged them (owner, 2026-10-25: same
# as Sublarr). A scanner wired to fail the build on its first run just
# teaches everyone to ignore a red X.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependencies rot without anyone touching the repo: a CVE published
    # today applies to code that last changed in April. A push-only trigger
    # would never notice. Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # npm audit — the one blocking security check.
  #
  # Scope is `--omit=dev` deliberately. The dev tree (vite, eslint, jest,
  # playwright …) never reaches a user's server; treating a devDependency
  # advisory as release-blocking is how audit gates get switched off
  # wholesale. Production dependencies are the ones that ship.
  #
  # Threshold measured on main @ 6fe74af3 (2026-08-30), `npm audit
  # --omit=dev` in each tree:
  #
  #   backend :  1 high,                          0 critical
  #   frontend: 10 high, 1 moderate,              0 critical
  #
  # So `--audit-level=high` would have been born red in BOTH trees — a
  # required check that has never once been green, which is worth less
  # than no check. `--audit-level=critical` exits 0 in both trees today
  # (verified: exit code 0 at critical, exit code 1 at high), so it is a
  # real gate that is genuinely passing and can genuinely start failing.
  #
  # What the current highs actually are, so the next person does not
  # re-derive it:
  #
  #   * frontend, 10 of the 11: one chain — image-size <- texture-compressor
  #     <- @loaders.gl/textures <- deck.gl 9.x. npm's only offered "fix" is
  #     deck.gl 8.9.36, a MAJOR DOWNGRADE of the mapping stack. The
  #     advisories are DoS loops in ICNS/JXL/HEIF decoding inside a texture
  #     CLI that the browser bundle never executes. There is no forward fix
  #     to take; taking the backward one would break the maps.
  #   * frontend dompurify (moderate) via jspdf, and backend undici (high)
  #     via cheerio, both have real in-range fixes available. Those are
  #     ordinary dependency-bump work, tracked separately — not a reason to
  #     wire a gate that blocks every unrelated commit until they land.
  #
  # Raise this to `high` the moment those numbers reach zero. Do not raise
  # it as an aspiration.
  # ---------------------------------------------------------------------
  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `npm audit` queries the registry from the lockfile and needs no
      # node_modules, so there is no install step here.
      - name: Audit backend production dependencies
        run: cd backend && npm audit --omit=dev --audit-level=critical

      - name: Audit frontend production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=critical

      # Runs even when the gate above passes, so the highs stay visible
      # instead of sitting silently under the threshold until one of them
      # is upgraded to critical by an advisory revision.
      - name: Report full advisory counts
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### npm audit — production dependencies"
            echo ""
            echo "Blocking threshold: critical. Lower severities are reported, not gated."
            echo ""
            echo "| Tree | critical | high | moderate | low |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for tree in backend frontend; do
            # `npm audit` exits non-zero when it finds anything, which would
            # kill the step under `set -e` before the summary is written.
            counts=$(cd "$tree" && npm audit --omit=dev --json 2>/dev/null || true)
            printf '%s' "$counts" | node -e '
              let raw = "";
              process.stdin.on("data", d => raw += d);
              process.stdin.on("end", () => {
                let v = {};
                try { v = JSON.parse(raw).metadata.vulnerabilities || {}; } catch {}
                const n = k => v[k] ?? 0;
                console.log(`| ${process.argv[1]} | ${n("critical")} | ${n("high")} | ${n("moderate")} | ${n("low")} |`);
              });
            ' "$tree" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------
  # Trivy — repository scan, findings go to the job log.
  #
  # NOT a gate, and `exit-code: 0` below says so honestly rather than
  # hiding a failure behind continue-on-error. The table report in the log
  # is the product of this job; nothing is uploaded to code scanning.
  #
  # The action tag is `v0.36.0`. The tags carry a leading `v`; a plain
  # `0.33.1` does not resolve and the step fails to load.
  #
  # `ignore-unfixed` keeps the list actionable: an advisory with no
  # released fix is not something this repo can act on today.
  # ---------------------------------------------------------------------
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # Reporting job: the log is the output, not the exit status.
          exit-code: "0"

  # ---------------------------------------------------------------------
  # Trivy, against the IMAGE this time (forgejo#28).
  #
  # The filesystem scan above reads this repository. It cannot see the base
  # image, the OS packages in it, or anything `npm ci` resolved at build
  # time — and those are what a user actually runs. TravStats publishes to
  # GHCR and Docker Hub, so an unscanned image is the one artifact that
  # reaches other people's servers.
  #
  # Scheduled and manual only, deliberately. The image is built locally and
  # pushed by `/deploy`, not by CI, so there is nothing new to scan on a
  # push — running it there would report last week's image as if the commit
  # had produced it.
  #
  # `:latest` is the tag a user gets by default, which is the one worth
  # watching. It can be absent on a fresh registry; the job says so and
  # stops rather than failing, because "no image published yet" is not a
  # security finding.
  # ---------------------------------------------------------------------
  trivy-image:
    name: Trivy image scan (published :latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check the tag exists before scanning it
        id: probe
        run: |
          if docker manifest inspect ghcr.io/abrechen2/travstats:latest >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No :latest on GHCR yet — nothing to scan." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Trivy
        if: steps.probe.outputs.found == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/abrechen2/travstats:latest
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # Reporting job: the log is the output, not the exit status.
          exit-code: "0"

  # ---------------------------------------------------------------------
  # CodeQL — deliberately NOT here, and not in the repository either.
  #
  # GitHub's default code-scanning setup ran CodeQL from 2026-08-01 and was
  # switched off on 2026-10-25 together with Trivy's SARIF uploads: its
  # results only fed the Security tab and never gated anything. A CodeQL job
  # brought back into a workflow would print its results to the log like
  # Trivy does, not upload them.
  # ---------------------------------------------------------------------
