name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence — what should TravStats do?
    validations:
      required: true

  - type: textarea
    id: problem_and_solution
    attributes:
      label: What's the problem and how can it be solved?
      description: Describe the user need and how you'd like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you discarded them.
