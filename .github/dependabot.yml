version: 2
updates:
  # Backend (npm)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  # Frontend (npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      # 0.5 declares a peer of eslint ^9 || ^10; the frontend is on ESLint 8.
      # Grouped in, it fails the whole minor-patch PR on ERESOLVE (#298).
      # Lift this with the ESLint 9 move.
      - dependency-name: eslint-plugin-react-refresh
        versions: ['>=0.5.0']
      # typescript-eslint 8.68 declares typescript '>=4.8.4 <6.1.0'; the
      # frontend lint would lose its parser on 7. Lift when typescript-eslint
      # names 7 in its peer range (#283).
      - dependency-name: typescript
        versions: ['>=7.0.0']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
