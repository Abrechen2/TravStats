version: "3.8"

services:
  # PostgreSQL Database with PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: travstats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - travstats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travstats-network

  # Combined Frontend + Backend Application
  app:
    image: travstats:latest
    container_name: travstats-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      # Database connection (simplified - individual fields)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: flights
      DB_USER: flights
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # Backend settings
      NODE_ENV: production
      PORT: 8000

      # Optional: Auto-seed airports on first start
      SEED_AIRPORTS: ${SEED_AIRPORTS:-true}
    volumes:
      # Persistent data for auto-generated JWT secret
      - travstats-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - travstats-network

volumes:
  travstats-db-data:
    driver: local
  travstats-app-data:
    driver: local

networks:
  travstats-network:
    driver: bridge
