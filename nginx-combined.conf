server {
    listen 80;
    server_name _;

    # Security headers are set by Helmet (Express middleware) — do NOT duplicate here.
    # Duplicating causes conflicts (e.g. X-XSS-Protection: 0 vs 1; mode=block).
    server_tokens off;

    # Frontend - served from /app/frontend/dist
    root /app/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # API proxy to backend (Node.js on port 8000).
    # `^~` is load-bearing: without it the regex location for static assets
    # (`~* \.(png|jpg|...)$`) outranks this plain prefix, so any API URL that
    # ends in an image extension — e.g. the profile-picture route
    # /api/v1/settings/profile-picture/<file>.png, or an image receipt under
    # /api/v1/uploads/receipts/ — was served from the SPA root and died as an
    # nginx 404 before ever reaching the backend (2.4.0-rc.1 UAT finding).
    location ^~ /api {
        # Uploads flow through /api (receipts 10 MB, PDFs 20 MB, trip photos up
        # to 20 × 15 MB in a single batch request). nginx defaults to 1 MB and
        # would reject anything larger with 413 before it ever reaches the
        # backend (issue #153). The backend still enforces the real per-file /
        # per-batch limits via multer — this is only the transport ceiling.
        client_max_body_size 100m;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Cookie forwarding - ensure cookies are forwarded correctly
        proxy_cookie_path / /;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }

    # Block dotfile access (defense-in-depth: .env, .git, .htpasswd, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # index.html carries the map from the app to its hashed chunk names, so it
    # must be revalidated on every load. It used to be served with no
    # Cache-Control at all, which makes a browser fall back to heuristic
    # freshness and reuse it for hours without asking. The stale copy then points
    # at chunk hashes the new image no longer has — either the browser still has
    # them in the `immutable` asset cache below and the user silently keeps
    # running the old frontend against the new API, or it doesn't and the dynamic
    # import 404s into a blank page. Both were reproduced during the 2.4.0-rc.5
    # UAT. `no-cache` still stores the file; it only forces the ETag
    # revalidation, so a 304 is the normal case.
    #
    # add_header does NOT inherit once a location sets its own — the security
    # headers have to be repeated here (same trap as the asset block below).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Frontend - SPA routing (all other requests go to index.html)
    # Security headers for non-API responses (Helmet covers /api exclusively)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Ignore source map requests (return 204 No Content to prevent errors)
    location ~* \.map$ {
        access_log off;
        return 204;
    }

    # Cache static assets — must repeat security headers (nginx add_header doesn't inherit)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
