server {
    listen 80;
    server_name _;

    # Security headers are set by Helmet (Express middleware) — do NOT duplicate here.
    # Duplicating causes conflicts (e.g. X-XSS-Protection: 0 vs 1; mode=block).
    server_tokens off;

    # Frontend - served from /app/frontend/dist
    root /app/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # API proxy to backend (Node.js on port 8000)
    location /api {
        # Uploads flow through /api (receipts 10 MB, PDFs 20 MB, trip photos up
        # to 20 × 15 MB in a single batch request). nginx defaults to 1 MB and
        # would reject anything larger with 413 before it ever reaches the
        # backend (issue #153). The backend still enforces the real per-file /
        # per-batch limits via multer — this is only the transport ceiling.
        client_max_body_size 100m;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Cookie forwarding - ensure cookies are forwarded correctly
        proxy_cookie_path / /;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }

    # Block dotfile access (defense-in-depth: .env, .git, .htpasswd, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend - SPA routing (all other requests go to index.html)
    # Security headers for non-API responses (Helmet covers /api exclusively)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Ignore source map requests (return 204 No Content to prevent errors)
    location ~* \.map$ {
        access_log off;
        return 204;
    }

    # Cache static assets — must repeat security headers (nginx add_header doesn't inherit)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
