server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # index.html must be revalidated on every load — see nginx-combined.conf for
    # the full story: with no Cache-Control the browser caches it heuristically
    # and keeps pointing at chunk hashes that no longer exist after an update.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (if needed).
    # `^~` is load-bearing — see nginx-combined.conf: without it the static
    # asset regex below hijacks API URLs ending in an image extension.
    location ^~ /api {
        # Allow large uploads (trip-photo batches, PDFs). See issue #153 —
        # nginx defaults to 1 MB; the backend enforces the real limits.
        client_max_body_size 100m;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
