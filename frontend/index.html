<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>TravStats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!--
      Globe textures (~2.2 MB total). `rel="prefetch"` lets the browser
      pull them with idle-priority during initial app load so the first
      time the user opens the 3D Globe mode the sphere paints instantly
      instead of flashing a blank black ball while textures stream in.
      Skipped if the user never enables cruise/globe mode — the lazy
      `import("./GlobeView")` only triggers on view-mode switch, but
      cached textures are ready when it does.
    -->
    <link rel="prefetch" as="image" href="/earth-night.jpg" />
    <link rel="prefetch" as="image" href="/earth-topology.png" />
    <link rel="prefetch" as="image" href="/night-sky.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
