<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>TravStats</title>
    <!--
      Fonts are self-hosted under /fonts and declared in src/theme/fonts.css.
      The Google Fonts stylesheet that used to sit here loaded Syne, Inter and
      IBM Plex Mono from two third-party origins that the app's CSP does not
      allow, and Syne and Inter are retired anyway (owner, 2026-09-05: one
      family everywhere). Preloading the two faces the first paint needs keeps
      the swap invisible.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/hanken-grotesk-400-latin.woff2"
      crossorigin=""
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/hanken-grotesk-700-latin.woff2"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!--
      Globe textures (~4.3 MB) used to be prefetched here. They're now
      prefetched on dashboard mount via `prefetchGlobeTextures()` so a
      cold /login doesn't pay 4 MB for a feature most users never open.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
