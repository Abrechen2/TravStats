services:
  db:
    image: postgis/postgis:15-3.4
    container_name: preview-${SLOT}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flights
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/abrechen2/travstats:${IMAGE_TAG}
    container_name: preview-${SLOT}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flights:${POSTGRES_PASSWORD}@db:5432/flights
      TZ: UTC
      APP_VERSION: ${IMAGE_TAG}
      CREATE_DEMO_USER: "false"
      SEED_AIRPORTS: "false"
      # No LLM on the previews: the cluster node they run on measured an
      # Ollama parse at 0.3 tok/s (2026-07-09), so every call timed out and
      # fell back to the templates anyway. There is simply no OLLAMA_URL here.
      # The `USE_LLM_PARSER: "false"` that used to stand here was read by no
      # code at all; the real switch is the admin setting "KI-Parser"
      # (admin_settings.llm_enabled, services/llm/llmGate.ts), which also
      # holds when OLLAMA_URL is set.
      FRONTEND_URL: https://${PUBLIC_HOST}
      ALLOW_REGISTRATION: "false"
    ports:
      - "127.0.0.1:${HOST_PORT}:80"
    networks:
      - default
      - preview-net

volumes:
  pgdata:

networks:
  preview-net:
    external: true
